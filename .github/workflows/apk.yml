# Navi — monta o APK de teste do app Android (Capacitor) e publica como artefato "navi-teste".
# Baixar: GitHub → Actions → "APK de teste" → execução mais recente com ✓ → Artifacts → navi-teste.
name: APK de teste

on:
  push:
    branches: [app/android]
    paths:
      - 'app-android/**'
      - 'site-acessivel/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

# A montagem instala pacotes do npm, então só lê o repositório.
# Só o job "publicar", que não instala nada, escreve (na branch apk-teste).
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor e o plugin de Bluetooth
        run: npm install --no-audit --no-fund

      - name: Copiar o site para dentro do app
        run: npm run copiar-site

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Permissões, chave de teste e ícone
        run: npm run ajustar-android

      - name: Sincronizar site e plugins
        run: npx cap sync android

      - name: Montar o APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../navi-teste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: navi-teste
          path: app-android/navi-teste.apk
          retention-days: 30
          if-no-files-found: error

  # Atalho para quem não usa o Actions: a branch apk-teste guarda só o APK mais recente.
  # No GitHub: troque a branch para apk-teste, abra navi-teste.apk e clique em "Download raw file".
  publicar:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: navi-teste
          path: apk

      - name: Publicar o APK na branch apk-teste
        working-directory: apk
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf 'APK de teste do Navi, gerado do commit %s da branch app/android em %s (UTC).\nComo instalar: app-android/LEIA-ME.md na branch app/android.\n' "${GITHUB_SHA::7}" "$(date -u '+%d/%m/%Y %H:%M')" > LEIA-ME.txt
          git init -q -b apk-teste
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "APK de teste ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-teste
