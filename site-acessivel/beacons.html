(function () { try {
  var s = localStorage, h = document.documentElement, t = s.getItem('navi-tema'), x = s.getItem('navi-texto');
  if (!t && s.getItem('navi-contraste') === '1') t = 'contraste';
  if (t === 'contraste' || t === 'daltonismo') h.classList.add(t);
  if (x === '1') x = '125';
  if (['125', '150', '175', '200'].indexOf(x) >= 0) { h.setAttribute('data-texto', x); h.classList.add('texto-grande'); }
} catch (e) {} })();
</script>
